# For dev use
version: '3.8'

services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: baas-db
    environment:
      POSTGRES_USER: baas_user
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: baas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baas_user -d baas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # backend:
