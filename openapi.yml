openapi: 3.1.0

info:
  title: Neue Konzepte BaaS Backend API
  version: 0.1.0
  description: |
    Backend API for the Neue Konzepte BaaS project.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: Authentication and the current account
  - name: fields
    description: Fields and plots owned by a farmer

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Verifies the credentials and, on success, sets the `access_token` and
        `refresh_token` cookies. Both cookies are HttpOnly; `Secure` and the
        `SameSite` mode depend on the server configuration.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted; auth cookies set.
          headers:
            Set-Cookie:
              description: |
                Two cookies are set:
                `access_token=<jwt>; Path=/; Max-Age=900; HttpOnly` and
                `refresh_token=<jwt>; Path=/api/auth/refresh; Max-Age=604800; HttpOnly`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Malformed body, or a missing email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingFields:
                  value:
                    error: email and password are required
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid credentials
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated account
      description: Returns the account resolved from the `access_token` cookie.
      operationId: getCurrentAccount
      responses:
        '200':
          description: The authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated

  /api/fields:
    post:
      tags: [fields]
      summary: Create a field
      description: |
        Creates a field owned by the authenticated farmer. The coordinates
        must describe a rectangle. Requires the `farmer` role.
      operationId: createField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
      responses:
        '201':
          description: Field created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          description: Malformed body, missing name, or coordinates are not a valid rectangular GeoJSON Polygon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingName:
                  value:
                    error: name is required
                invalidCoordinates:
                  value:
                    error: coordinates must be a valid GeoJSON Polygon
                notRectangle:
                  value:
                    error: field must be a rectangle
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/fields/{fieldID}/plots:
    post:
      tags: [fields]
      summary: Create a plot on a field
      description: |
        Creates a plot on the given field. The field must be owned by the
        authenticated farmer, and the plot's coordinates must describe a
        rectangle within the field's boundaries. Requires the `farmer` role.
      operationId: createPlot
      parameters:
        - name: fieldID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlotRequest'
      responses:
        '201':
          description: Plot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plot'
        '400':
          description: Malformed body, missing name, or coordinates are not a valid rectangular GeoJSON Polygon within the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFieldId:
                  value:
                    error: invalid field id
                invalidBody:
                  value:
                    error: invalid request body
                missingName:
                  value:
                    error: name is required
                invalidCoordinates:
                  value:
                    error: coordinates must be a valid GeoJSON Polygon
                notRectangle:
                  value:
                    error: plot must be a rectangle within the field's boundaries
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer, or the field is not owned by this farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientPermissions:
                  value:
                    error: insufficient permissions
                notOwner:
                  value:
                    error: field is not owned by this farmer
        '404':
          description: Field not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: field not found
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT cookie set by `POST /api/auth/login`. Valid for 15 minutes.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Surrounding whitespace is trimmed before lookup.
          example: user@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple

    Account:
      type: object
      required: [id, first_name, last_name, role]
      properties:
        id:
          type: string
          format: uuid
          example: 6f1a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8
        first_name:
          type: string
          example: Ada
        last_name:
          type: string
          example: Lovelace
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      description: Implied by which subtype table the account joins to.
      enum: [admin, farmer, customer]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    GeoJSONPolygon:
      type: object
      description: A GeoJSON Polygon geometry.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          description: An array of linear rings; the first is the exterior boundary.
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
      example:
        type: Polygon
        coordinates:
          - - [9.1798, 48.7758]
            - [9.1808, 48.7758]
            - [9.1808, 48.7768]
            - [9.1798, 48.7768]
            - [9.1798, 48.7758]

    CreateFieldRequest:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed.
          example: North Field
        coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJSONPolygon'
          description: Must describe a rectangle.

    CreatePlotRequest:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed.
          example: Plot A
        coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJSONPolygon'
          description: Must describe a rectangle within the field's boundaries.

    Field:
      type: object
      required: [id, name, farmer, coordinates]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: North Field
        farmer:
          type: string
          format: uuid
          description: ID of the account that owns this field.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'

    Plot:
      type: object
      required: [id, name, field, coordinates]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plot A
        field:
          type: string
          format: uuid
          description: ID of the field this plot belongs to.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'

security:
  - accessTokenCookie: []
