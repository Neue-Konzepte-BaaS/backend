openapi: 3.1.0

info:
  title: Neue Konzepte BaaS Backend API
  version: 0.1.0
  description: |
    Backend API for the Neue Konzepte BaaS project.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: Authentication and the current account
  - name: fields
    description: Fields and plots owned by a farmer
  - name: plots
    description: Public plot search

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new farmer or customer account
      description: |
        Creates an account and its role-specific record in one transaction, then
        signs the new user in by setting the same `access_token` and
        `refresh_token` cookies as `POST /api/auth/login`.

        The role is chosen by the client: `farmer` or `customer`. Admins are
        seeded directly in the database and cannot be registered here. A farmer
        must supply `farm_name`; both roles must supply `postal_code`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; auth cookies set.
          headers:
            Set-Cookie:
              description: |
                Two cookies are set:
                `access_token=<jwt>; Path=/; Max-Age=900; HttpOnly` and
                `refresh_token=<jwt>; Path=/api/auth/refresh; Max-Age=604800; HttpOnly`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAccount'
        '400':
          description: Malformed body, a missing required field, or an unsupported role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    error: first name, last name, email and password are required
                missingFarmName:
                  value:
                    error: farm name is required for farmers
                badRole:
                  value:
                    error: role must be farmer or customer
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email already registered
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Verifies the credentials and, on success, sets the `access_token` and
        `refresh_token` cookies. Both cookies are HttpOnly; `Secure` and the
        `SameSite` mode depend on the server configuration.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted; auth cookies set.
          headers:
            Set-Cookie:
              description: |
                Two cookies are set:
                `access_token=<jwt>; Path=/; Max-Age=900; HttpOnly` and
                `refresh_token=<jwt>; Path=/api/auth/refresh; Max-Age=604800; HttpOnly`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAccount'
        '400':
          description: Malformed body, or a missing email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingFields:
                  value:
                    error: email and password are required
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid credentials
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated account
      description: Returns the id and role resolved from the `access_token` cookie.
      operationId: getCurrentAccount
      responses:
        '200':
          description: The authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAccount'
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: |
        Expires the `access_token` and `refresh_token` cookies. Because the
        cookies are HttpOnly the browser cannot clear them itself, so this
        endpoint is how a session actually ends. Idempotent — safe to call when
        not logged in.
      operationId: logout
      security: []
      responses:
        '204':
          description: Cookies expired.
          headers:
            Set-Cookie:
              description: Both auth cookies are re-sent with `Max-Age=0`.
              schema:
                type: string
  /api/fields:
    get:
      tags: [fields]
      summary: List fields and plots
      description: |
        Returns all fields owned by the authenticated farmer, each including
        its plots. Requires the `farmer` role.
      operationId: getFields
      responses:
        '200':
          description: The farmer's fields, with their plots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldWithPlots'
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

    post:
      tags: [fields]
      summary: Create a field
      description: |
        Creates a field owned by the authenticated farmer. The coordinates
        must describe a rectangle. Requires the `farmer` role.
      operationId: createField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
      responses:
        '201':
          description: Field created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          description: Malformed body, missing name, or coordinates are not a valid rectangular GeoJSON Polygon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingName:
                  value:
                    error: name is required
                invalidCoordinates:
                  value:
                    error: coordinates must be a valid GeoJSON Polygon
                notRectangle:
                  value:
                    error: field must be a rectangle
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/fields/{fieldID}/plots:
    post:
      tags: [fields]
      summary: Create a plot on a field
      description: |
        Creates a plot on the given field. The field must be owned by the
        authenticated farmer, and the plot's coordinates must describe a
        rectangle within the field's boundaries. Requires the `farmer` role.
      operationId: createPlot
      parameters:
        - name: fieldID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlotRequest'
      responses:
        '201':
          description: Plot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plot'
        '400':
          description: Malformed body, missing name, or coordinates are not a valid rectangular GeoJSON Polygon within the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFieldId:
                  value:
                    error: invalid field id
                invalidBody:
                  value:
                    error: invalid request body
                missingName:
                  value:
                    error: name is required
                invalidCoordinates:
                  value:
                    error: coordinates must be a valid GeoJSON Polygon
                notRectangle:
                  value:
                    error: plot must be a rectangle within the field's boundaries
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer, or the field is not owned by this farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientPermissions:
                  value:
                    error: insufficient permissions
                notOwner:
                  value:
                    error: field is not owned by this farmer
        '404':
          description: Field not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: field not found
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/plots/nearest:
    get:
      tags: [plots]
      summary: Find the nearest plots
      description: |
        Searches across all farmers' plots and returns the nearest ones to a
        search point, nearest first. Public endpoint — no authentication
        required.

        Only plots that are currently available are returned: a plot with a
        rental covering the present moment is omitted, and reappears once that
        rental's period has elapsed.

        The search point is given either as coordinates (`lat` and `lon`
        together) or as a German location (`postalCode` or `city`). Exactly
        one of these two approaches must be used; `lat`/`lon` take
        precedence if both are somehow provided. `postalCode` is matched
        exactly; `city` is matched as a case-insensitive substring against
        the location dataset and only the first match (alphabetically) is
        used to resolve coordinates.
      operationId: findNearestPlots
      security: []
      parameters:
        - name: lat
          in: query
          description: Latitude of the search point. Must be provided together with `lon`.
          schema:
            type: number
            format: double
          example: 48.7758
        - name: lon
          in: query
          description: Longitude of the search point. Must be provided together with `lat`.
          schema:
            type: number
            format: double
          example: 9.1829
        - name: postalCode
          in: query
          description: A German postal code, matched exactly against the location dataset.
          schema:
            type: string
          example: '70173'
        - name: city
          in: query
          description: A German city or locality name, matched as a case-insensitive substring.
          schema:
            type: string
          example: Stuttgart
        - name: limit
          in: query
          description: Maximum number of plots to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          example: 10
      responses:
        '200':
          description: The nearest plots, ordered by ascending distance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyPlot'
        '400':
          description: Malformed input, or neither coordinates nor a postal code/city were given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingLocation:
                  value:
                    error: provide lat and lon, or postalCode or city
                invalidCoordinates:
                  value:
                    error: lat and lon must be numbers
                invalidLimit:
                  value:
                    error: limit must be a number between 1 and 100
        '404':
          description: No location matches the given postal code or city.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no location found for the given postal code or city
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/rentals:
    post:
      tags: [rentals]
      summary: Rent a plot
      description: |
        Books a plot for the authenticated customer. The rental starts
        immediately and runs for a fixed six months; the duration is not yet
        configurable. Customers only — a farmer or admin receives 403.

        A plot can only be booked once for any given moment: renting a plot
        whose existing rental overlaps the new period fails with 409. Once a
        rental's period has elapsed the plot can be rented again.
      operationId: rentPlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentPlotRequest'
      responses:
        '201':
          description: The plot was rented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
        '400':
          description: Malformed body or plot id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidPlotID:
                  value:
                    error: invalid plot id
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '404':
          description: No plot with the given id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: plot not found
        '409':
          description: The plot is already rented for an overlapping period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: plot is already rented
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

    get:
      tags: [rentals]
      summary: List the authenticated customer's rentals
      description: |
        Returns every rental belonging to the authenticated customer, newest
        first, each with the plot it books. Expired rentals are included.
        Customers only — a farmer or admin receives 403.
      operationId: getRentals
      responses:
        '200':
          description: The customer's rentals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalWithPlot'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT cookie set by `POST /api/auth/login`. Valid for 15 minutes.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Surrounding whitespace is trimmed before lookup.
          example: user@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple

    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, role, postal_code]
      description: |
        Fields are role-dependent. A `farmer` must also supply `farm_name`; a
        `customer` supplies only the shared fields plus `postal_code`. `role`
        must be `farmer` or `customer` — `admin` is rejected.
      properties:
        first_name:
          type: string
          example: Ada
        last_name:
          type: string
          example: Lovelace
        email:
          type: string
          format: email
          description: Surrounding whitespace is trimmed; must be unique.
          example: ada@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple
        role:
          type: string
          enum: [farmer, customer]
          example: customer
        postal_code:
          type: integer
          format: int32
          description: The account's postal code; required for both roles.
          example: 76133
        farm_name:
          type: string
          description: Required when `role` is `farmer`; ignored otherwise.
          example: Green Acres

    SessionAccount:
      type: object
      description: The minimal identity returned after authenticating.
      required: [id, role]
      properties:
        id:
          type: string
          format: uuid
          example: 6f1a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      description: Implied by which subtype table the account joins to.
      enum: [admin, farmer, customer]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    GeoJSONPolygon:
      type: object
      description: A GeoJSON Polygon geometry.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          description: An array of linear rings; the first is the exterior boundary.
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
      example:
        type: Polygon
        coordinates:
          - - [9.1798, 48.7758]
            - [9.1808, 48.7758]
            - [9.1808, 48.7768]
            - [9.1798, 48.7768]
            - [9.1798, 48.7758]

    CreateFieldRequest:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed.
          example: North Field
        coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJSONPolygon'
          description: Must describe a rectangle.

    CreatePlotRequest:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed.
          example: Plot A
        coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJSONPolygon'
          description: Must describe a rectangle within the field's boundaries.

    Field:
      type: object
      required: [id, name, farmer, coordinates]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: North Field
        farmer:
          type: string
          format: uuid
          description: ID of the account that owns this field.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'

    Plot:
      type: object
      required: [id, name, field, coordinates]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plot A
        field:
          type: string
          format: uuid
          description: ID of the field this plot belongs to.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'

    NearbyPlot:
      type: object
      required: [id, name, field, coordinates, distanceMeters]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plot A
        field:
          type: string
          format: uuid
          description: ID of the field this plot belongs to.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'
        distanceMeters:
          type: number
          format: double
          description: Distance from the search point to the plot's centroid, in meters.
          example: 1523.42

    FieldWithPlots:
      type: object
      required: [id, name, farmer, coordinates, plots]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: North Field
        farmer:
          type: string
          format: uuid
          description: ID of the account that owns this field.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'
        plots:
          type: array
          items:
            $ref: '#/components/schemas/Plot'

    RentPlotRequest:
      type: object
      required: [plotId]
      properties:
        plotId:
          type: string
          format: uuid
          description: ID of the plot to rent.
          example: ed453eb5-2abb-4fcb-9421-f9b69490fe37

    Rental:
      type: object
      required: [id, plotId, startAt, endAt]
      properties:
        id:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
          description: ID of the rented plot.
        startAt:
          type: string
          format: date-time
          description: |
            When the rental begins, set from the database clock at booking
            time.
          example: '2026-09-13T14:49:56+02:00'
        endAt:
          type: string
          format: date-time
          description: |
            When the rental ends, exclusive — six months after `startAt`. A
            rental beginning exactly at another's `endAt` does not conflict.
          example: '2027-03-13T14:49:56+01:00'

    RentalWithPlot:
      allOf:
        - $ref: '#/components/schemas/Rental'
        - type: object
          required: [plot]
          properties:
            plot:
              $ref: '#/components/schemas/Plot'

security:
  - accessTokenCookie: []
