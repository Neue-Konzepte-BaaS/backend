openapi: 3.1.0

info:
  title: Neue Konzepte BaaS Backend API
  version: 0.1.0
  description: |
    Backend API for the Neue Konzepte BaaS project.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: Authentication and the current account
  - name: farms
    description: Public farm details, shown to customers browsing plots
  - name: fields
    description: Fields and plots owned by a farmer
  - name: plots
    description: Public plot search, and which crops a plot offers
  - name: crops
    description: The crop catalog
  - name: rentals
    description: Renting plots
  - name: notifications
    description: Platform-wide notifications sent by an admin
  - name: announcements
    description: The Schwarzes Brett — notices a farmer posts for his current customers
  - name: ripeness
    description: Ready-to-harvest notices a farmer posts for a field's current growers
  - name: inbox
    description: A customer's merged feed of platform broadcasts, announcements, and ripeness notices
  - name: statistics
    description: Aggregate statistics for farmers and admins
  - name: admin
    description: Back-office listings an admin reads

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new farmer or customer account
      description: |
        Creates an account and its role-specific record in one transaction, then
        signs the new user in by setting the same `access_token` and
        `refresh_token` cookies as `POST /api/auth/login`.

        The role is chosen by the client: `farmer` or `customer`. Admins are
        seeded directly in the database and cannot be registered here. A farmer
        must supply `farm_name` and `address`; both roles must supply
        `postal_code`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; auth cookies set.
          headers:
            Set-Cookie:
              description: |
                Two cookies are set:
                `access_token=<jwt>; Path=/; Max-Age=900; HttpOnly` and
                `refresh_token=<jwt>; Path=/api/auth/refresh; Max-Age=604800; HttpOnly`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAccount'
        '400':
          description: Malformed body, a missing required field, or an unsupported role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    error: first name, last name, email and password are required
                missingFarmName:
                  value:
                    error: farm name is required for farmers
                missingAddress:
                  value:
                    error: address is required for farmers
                badRole:
                  value:
                    error: role must be farmer or customer
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email already registered
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Verifies the credentials and, on success, sets the `access_token` and
        `refresh_token` cookies. Both cookies are HttpOnly; `Secure` and the
        `SameSite` mode depend on the server configuration.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted; auth cookies set.
          headers:
            Set-Cookie:
              description: |
                Two cookies are set:
                `access_token=<jwt>; Path=/; Max-Age=900; HttpOnly` and
                `refresh_token=<jwt>; Path=/api/auth/refresh; Max-Age=604800; HttpOnly`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAccount'
        '400':
          description: Malformed body, or a missing email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingFields:
                  value:
                    error: email and password are required
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid credentials
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated account
      description: |
        Resolves the account id and role from the `access_token` cookie, then
        looks up the full account (name, postal code) fresh from the database.
      operationId: getCurrentAccount
      responses:
        '200':
          description: The authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAccount'
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: |
        Expires the `access_token` and `refresh_token` cookies. Because the
        cookies are HttpOnly the browser cannot clear them itself, so this
        endpoint is how a session actually ends. Idempotent — safe to call when
        not logged in.
      operationId: logout
      security: []
      responses:
        '204':
          description: Cookies expired.
          headers:
            Set-Cookie:
              description: Both auth cookies are re-sent with `Max-Age=0`.
              schema:
                type: string

  /api/farms/{farmID}:
    get:
      tags: [farms]
      summary: Get public details of a farm
      description: |
        Returns the public details of the farm with the given id, including
        the total area of plots it currently offers on the platform. Public
        endpoint — no authentication required; used by customers browsing
        plots to see who they'd be renting from.
      operationId: getFarm
      security: []
      parameters:
        - name: farmID
          in: path
          required: true
          description: ID of the farm, e.g. the `farm` field on a `NearbyPlot`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The farm's public details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farm'
        '400':
          description: Malformed farm id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid farm id
        '404':
          description: No farm exists with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: farm not found
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/fields:
    get:
      tags: [fields]
      summary: List fields and plots
      description: |
        Returns all fields owned by the authenticated farmer, each including
        its plots and the crops each plot offers. Requires the `farmer` role.
      operationId: getFields
      responses:
        '200':
          description: The farmer's fields, with their plots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldWithPlots'
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

    post:
      tags: [fields]
      summary: Create a field
      description: |
        Creates a field owned by the authenticated farmer. The coordinates
        may describe any simple polygon — there is no rectangle requirement.
        Requires the `farmer` role.
      operationId: createField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
      responses:
        '201':
          description: Field created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          description: Malformed body, missing name, or coordinates are not a valid GeoJSON Polygon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingName:
                  value:
                    error: name is required
                invalidCoordinates:
                  value:
                    error: coordinates must be a valid GeoJSON Polygon
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/fields/{fieldID}/plots:
    post:
      tags: [fields]
      summary: Create a plot on a field
      description: |
        Creates a plot on the given field. The field must be owned by the
        authenticated farmer, and the plot's coordinates must lie within the
        field's boundaries — there is no rectangle requirement. Requires the
        `farmer` role.
      operationId: createPlot
      parameters:
        - name: fieldID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlotRequest'
      responses:
        '201':
          description: Plot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plot'
        '400':
          description: Malformed body, missing name, or coordinates are not a valid GeoJSON Polygon within the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFieldId:
                  value:
                    error: invalid field id
                invalidBody:
                  value:
                    error: invalid request body
                missingName:
                  value:
                    error: name is required
                invalidCoordinates:
                  value:
                    error: coordinates must be a valid GeoJSON Polygon
                notWithinField:
                  value:
                    error: plot must be within the field's boundaries
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer, or the field is not owned by this farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientPermissions:
                  value:
                    error: insufficient permissions
                notOwner:
                  value:
                    error: field is not owned by this farmer
        '404':
          description: Field not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: field not found
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/fields/{fieldID}/ripeness:
    post:
      tags: [ripeness]
      summary: Post a ripeness notice for a field
      description: |
        Stores the notice and emails it to the customers currently renting a
        plot of this field with the given crop. The field must be owned by
        the authenticated farmer. Requires the `farmer` role.

        Unlike the announcement board, a ripeness notice has no separate
        read endpoint of its own — it appears in the recipients'
        `GET /api/inbox` feed as a `ripeness_notice` item, mail-only
        otherwise.

        `recipients` is how many customers the message was queued for, not
        how many were reached, for the same reason as
        `POST /api/announcements`: delivery happens after this response,
        nothing is retried, and a customer growing this crop on several
        matching plots is counted and mailed once.
      operationId: createRipenessNotice
      parameters:
        - name: fieldID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRipenessNoticeRequest'
      responses:
        '201':
          description: The ripeness notice was stored and queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRipenessNotice'
        '400':
          description: Malformed body, invalid field id, or a missing/invalid `crop_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFieldId:
                  value:
                    error: invalid field id
                invalidBody:
                  value:
                    error: invalid request body
                invalidCropId:
                  value:
                    error: crop_id is required and must be a valid id
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer, or the field is not owned by this farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientPermissions:
                  value:
                    error: insufficient permissions
                notOwner:
                  value:
                    error: field is not owned by this farmer
        '404':
          description: Field or crop not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: field or crop not found
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/plots/nearest:
    get:
      tags: [plots]
      summary: Find the nearest plots
      description: |
        Searches across all farmers' plots and returns the nearest ones to a
        search point, nearest first. Public endpoint — no authentication
        required.

        Only plots that are currently available are returned: a plot with a
        rental covering the present moment is omitted, and reappears once that
        rental's period has elapsed.

        The search point is given either as coordinates (`lat` and `lon`
        together) or as a German location (`postalCode` or `city`). Exactly
        one of these two approaches must be used; `lat`/`lon` take
        precedence if both are somehow provided. `postalCode` is matched
        exactly; `city` is matched as a case-insensitive substring against
        the location dataset and only the first match (alphabetically) is
        used to resolve coordinates.
      operationId: findNearestPlots
      security: []
      parameters:
        - name: lat
          in: query
          description: Latitude of the search point. Must be provided together with `lon`.
          schema:
            type: number
            format: double
          example: 48.7758
        - name: lon
          in: query
          description: Longitude of the search point. Must be provided together with `lat`.
          schema:
            type: number
            format: double
          example: 9.1829
        - name: postalCode
          in: query
          description: A German postal code, matched exactly against the location dataset.
          schema:
            type: string
          example: '70173'
        - name: city
          in: query
          description: A German city or locality name, matched as a case-insensitive substring.
          schema:
            type: string
          example: Stuttgart
        - name: limit
          in: query
          description: Maximum number of plots to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          example: 10
      responses:
        '200':
          description: The nearest plots, ordered by ascending distance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyPlot'
        '400':
          description: Malformed input, or neither coordinates nor a postal code/city were given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingLocation:
                  value:
                    error: provide lat and lon, or postalCode or city
                invalidCoordinates:
                  value:
                    error: lat and lon must be numbers
                invalidLimit:
                  value:
                    error: limit must be a number between 1 and 100
        '404':
          description: No location matches the given postal code or city.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no location found for the given postal code or city
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/plots/{plotID}/crops:
    put:
      tags: [plots, crops]
      summary: Set the crops a plot offers
      description: |
        Replaces the full set of crops offered by the given plot with the
        provided list. The plot's field must be owned by the authenticated
        farmer. Requires the `farmer` role.
      operationId: setPlotCrops
      parameters:
        - name: plotID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlotCropsRequest'
      responses:
        '200':
          description: The plot's crops after the update.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Crop'
        '400':
          description: Malformed body, invalid plot id, or invalid crop id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPlotId:
                  value:
                    error: invalid plot id
                invalidBody:
                  value:
                    error: invalid request body
                invalidCropId:
                  value:
                    error: invalid crop id
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer, or the plot's field is not owned by this farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientPermissions:
                  value:
                    error: insufficient permissions
                notOwner:
                  value:
                    error: field is not owned by this farmer
        '404':
          description: The plot, or one of the given crop ids, does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: plot or crop not found
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/crops:
    get:
      tags: [crops]
      summary: List the crop catalog
      description: |
        Returns every crop in the catalog, ordered by name. Public endpoint —
        no authentication required.
      operationId: getAllCrops
      security: []
      responses:
        '200':
          description: The crop catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Crop'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

    post:
      tags: [crops]
      summary: Add a crop to the catalog
      description: |
        Creates a new crop with a fixed rental duration. Requires the `admin`
        role.
      operationId: createCrop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCropRequest'
      responses:
        '201':
          description: Crop created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crop'
        '400':
          description: Malformed body, missing name, or a non-positive duration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingName:
                  value:
                    error: name is required
                invalidDuration:
                  value:
                    error: durationMonths must be positive
        '401':
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '409':
          description: A crop with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: crop name already exists
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/rentals:
    post:
      tags: [rentals]
      summary: Rent a plot
      description: |
        Books a plot for the authenticated customer with the chosen crop. The
        rental starts immediately and runs for that crop's fixed duration.
        Customers only — a farmer or admin receives 403.

        The chosen crop must be one the plot offers (see
        `PUT /api/plots/{plotID}/crops`); otherwise the request fails with
        409. A plot can only be booked once for any given moment: renting a
        plot whose existing rental overlaps the new period also fails with
        409. Once a rental's period has elapsed the plot can be rented again.
      operationId: rentPlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentPlotRequest'
      responses:
        '201':
          description: The plot was rented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
        '400':
          description: Malformed body, plot id, or crop id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidPlotID:
                  value:
                    error: invalid plot id
                invalidCropID:
                  value:
                    error: invalid crop id
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '404':
          description: No plot or crop with the given id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: plot or crop not found
        '409':
          description: The crop is not offered by the plot, or the plot is already rented for an overlapping period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cropNotOffered:
                  value:
                    error: crop is not offered by this plot
                plotUnavailable:
                  value:
                    error: plot is already rented
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

    get:
      tags: [rentals]
      summary: List the authenticated customer's rentals
      description: |
        Returns every rental belonging to the authenticated customer, newest
        first, each with the plot and crop it books. Expired rentals are
        included. Customers only — a farmer or admin receives 403.
      operationId: getRentals
      responses:
        '200':
          description: The customer's rentals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalWithPlot'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/rentals/farm:
    get:
      tags: [rentals]
      summary: List every rental on the authenticated farmer's own plots
      description: |
        Returns every rental across all of the authenticated farmer's plots,
        newest first, active and historic alike, each with the field, plot
        and customer it belongs to. Farmers only — a customer or admin
        receives 403.
      operationId: getFarmRentals
      responses:
        '200':
          description: The farmer's rentals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalWithPlotAndCustomer'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/notifications:
    post:
      tags: [notifications]
      summary: Send a notification to every user
      description: |
        Stores the broadcast and emails it to every farmer and customer on the
        platform. Admins only — a farmer or customer receives 403.

        Admin accounts are deliberately not recipients: a platform notice is
        addressed to users, not to the operators sending it. Neither are
        accounts that somehow hold no farmer or customer role.

        The broadcast is stored before delivery is attempted, which is why a
        storage failure is reported as a `500` before any mail is sent.
        Delivery itself is asynchronous, which is why this still answers 202
        rather than 201 — the notice is persisted, but delivery is not done
        when the response is written. `recipients` is how many people the
        message was queued for, not how many were reached: delivery is not
        retried, so an address the mail relay rejects is logged and otherwise
        lost. The stored broadcast is readable afterwards regardless of
        delivery outcome, via `GET /api/inbox`.
      operationId: broadcastNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '202':
          description: The notification was queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastAccepted'
              example:
                recipients: 204
        '400':
          description: Malformed body, or a missing subject or body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingSubject:
                  value:
                    error: subject is required
                missingBody:
                  value:
                    error: body is required
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/admin/farms:
    get:
      tags: [admin]
      summary: List every farm on the platform
      description: |
        One page of the platform's farms, alphabetically by farm name. Admin
        only; every other role receives 403.

        This is the back-office view of a farm: it carries the owner and the
        holdings, where `GET /api/farms/{farmID}` is public and carries the
        description and founding date instead. `id` is the same farm id both
        accept. A farm that owns nothing yet is listed with zeros rather than
        left out.

        The `fields` and `plots` objects are the same shapes `GET
        /api/statistics` returns, computed by the same predicates — so summing
        `fields.total`, `plots.total` and `plots.rented` across every page
        reproduces the platform figures from that endpoint exactly.
        `occupancyRate` is a ratio in `[0, 1]`, areas are square meters, and
        `plots.rented` counts plots with a rental covering the present moment.

        There is deliberately no filter by farmer id: the scope is the whole
        platform, decided by the caller's role.
      operationId: listFarms
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring matched against the farm name and
            address, and the owner's name and email.
          schema:
            type: string
          example: green
        - name: postalCode
          in: query
          required: false
          description: Exact match on the farm's postal code.
          schema:
            type: integer
            format: int32
          example: 76133
      responses:
        '200':
          description: One page of farms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmPage'
              example:
                items:
                  - id: 2a7f4c30-8e51-4b92-bc07-1f6d9e3a5c84
                    farmerId: 3f1c9a8e-0b21-4d33-9a7e-5c2f1b8d4e60
                    name: Green Acres
                    address: 1 Farm Lane
                    postalCode: 76133
                    owner: { firstName: Old, lastName: MacDonald, email: old@example.com }
                    createdAt: '2026-09-13T16:21:04Z'
                    fields: { total: 3, areaSquareMeters: 128394.5 }
                    plots: { total: 42, rented: 17, available: 25, areaSquareMeters: 91002.1, occupancyRate: 0.4047619 }
                    activeRentals: 17
                  - id: 6d0b8e21-3a94-4c17-9f52-7b1c4d8e0a35
                    farmerId: 9b7d2f10-6c44-4a55-8e19-2d3a6f0c1b72
                    name: Aardvark Farm
                    address: 2 Empty Road
                    postalCode: 10115
                    owner: { firstName: Bare, lastName: Acres, email: bare@example.com }
                    createdAt: '2026-09-15T09:02:11Z'
                    fields: { total: 0, areaSquareMeters: 0 }
                    plots: { total: 0, rented: 0, available: 0, areaSquareMeters: 0, occupancyRate: 0 }
                    activeRentals: 0
                total: 2
                limit: 20
                offset: 0
        '400':
          $ref: '#/components/responses/BadPagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAnAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/accounts:
    get:
      tags: [admin]
      summary: List every account on the platform
      description: |
        One page of the platform's accounts, newest first. Admin only; every
        other role receives 403.

        `role` is derived from which subtype table the account joins to, not
        stored on the account. It is `null` for an account belonging to no
        subtype table at all — an orphan that nothing in the API can create,
        and that this listing is the place to notice.

        No password material is ever returned.
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - name: role
          in: query
          required: false
          description: >-
            Narrow to one role. A value outside the enum is a 400 rather than an
            empty page, so a typo does not read as "no such accounts".
          schema:
            $ref: '#/components/schemas/Role'
          example: farmer
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring matched against email, first name and
            last name.
          schema:
            type: string
          example: ada
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
              example:
                items:
                  - id: 3f1c9a8e-0b21-4d33-9a7e-5c2f1b8d4e60
                    firstName: Old
                    lastName: MacDonald
                    email: old@example.com
                    role: farmer
                    createdAt: '2026-09-13T16:21:04Z'
                  - id: 7c2e4b91-5a38-4f26-9d14-8b0e3a7c5d21
                    firstName: Cora
                    lastName: Customer
                    email: cora@example.com
                    role: customer
                    createdAt: '2026-09-12T08:45:30Z'
                total: 2
                limit: 20
                offset: 0
        '400':
          description: A malformed pagination parameter, or an unknown role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: role must be one of admin, farmer, customer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAnAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/announcements:
    post:
      tags: [announcements]
      summary: Post an announcement to the Schwarzes Brett
      description: |
        Stores the notice and emails it to the customers currently renting one
        of this farmer's plots. Farmers only — a customer or admin receives 403.

        By default the audience is every current renter. Setting `field_id` or
        `plot_id` (never both) narrows it to the customers currently renting a
        plot of that field, or that one plot — the board (`GET
        /api/announcements`) applies the same scope when a customer reads it.
        The field or plot must belong to this farmer, or the request is
        rejected the same way `POST /api/fields/{fieldID}/plots` rejects one
        it does not own.

        Unlike the platform broadcast this answers **201**, because the
        announcement itself is stored before the response is written. The board
        keeps it, so a customer who never receives the mail can still read it.

        `recipients` is how many customers the message was queued for, not how
        many were reached: delivery happens after the response, nothing is
        retried, and an address the relay rejects is logged and otherwise lost.
        A customer renting several matching plots from this farmer is counted
        and mailed once.

        Delivery failing does not fail the request — the announcement is
        already on the board, and `recipients` is then `0`. A `0` is therefore
        ambiguous: it means either that this farmer has no current renters or
        that the mail could not be queued at all. A client cannot tell the two
        apart, and should not report delivery on the strength of this number.
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
      responses:
        '201':
          description: The announcement was stored and queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAnnouncement'
        '400':
          description: |
            Malformed body, a missing subject or body, or one longer than the
            limit in `CreateAnnouncementRequest`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                missingSubject:
                  value:
                    error: subject is required
                missingBody:
                  value:
                    error: body is required
                subjectTooLong:
                  value:
                    error: subject is too long
                bodyTooLong:
                  value:
                    error: body is too long
                bothScoped:
                  value:
                    error: at most one of field_id, plot_id may be set
                invalidFieldId:
                  value:
                    error: invalid field id
                invalidPlotId:
                  value:
                    error: invalid plot id
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a farmer, or `field_id`/`plot_id` is not owned by this farmer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientPermissions:
                  value:
                    error: insufficient permissions
                notOwner:
                  value:
                    error: field or plot is not owned by this farmer
        '404':
          description: The given `field_id`/`plot_id` does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: field or plot not found
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

    get:
      tags: [announcements]
      summary: Read the Schwarzes Brett
      description: |
        The board, scoped to who is asking. A **farmer** sees the announcements
        he has posted. A **customer** sees the announcements of every farmer he
        is currently renting from, each notice once however many plots he rents
        from that farmer.

        A notice posted with `field_id`/`plot_id` set only appears for a
        customer whose active rental actually covers that field/plot — not
        merely for being that farmer's customer.

        The rental decides *which farmers* a customer reads, not *which
        notices*, so the board is not a record of the mail he received: a
        customer who starts renting today also reads everything that farmer
        posted before (subject to the scope above), and when a rental ends
        that farmer's notices leave the board even if the customer was mailed
        them at the time.

        Newest first. An admin receives 403: the board belongs to the farms and
        their customers.
      operationId: listAnnouncements
      responses:
        '200':
          description: The board, newest first. Empty when there is nothing to read.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is neither a farmer nor a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/inbox:
    get:
      tags: [inbox]
      summary: Read the authenticated customer's inbox
      description: |
        A merged, newest-first feed of every platform broadcast, the
        announcements of every farmer this customer currently rents from, and
        the ripeness notices for the crops this customer is currently
        growing. Customers only — a farmer or admin receives 403.

        Each item carries its `kind` (`broadcast`, `announcement`, or
        `ripeness_notice`) so a client can render one feed instead of three.
        `farm_name` is present on announcement and ripeness items; broadcasts
        have no farm to attribute. `field_name`/`crop_name` are present only
        on ripeness items.

        As with `GET /api/announcements`, the rental decides which farmers'
        announcements and ripeness notices appear, not which notices were
        mailed to this customer: a new renter also reads that farmer's older
        notices (subject to any `field_id`/`plot_id` scope), and an ended
        rental removes that farmer's notices from the feed. A ripeness notice
        additionally requires the active rental's crop to match the notice's
        crop.
      operationId: getInbox
      responses:
        '200':
          description: The inbox, newest first. Empty when there is nothing to read.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboxItem'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is not a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

  /api/statistics:
    get:
      tags: [statistics]
      summary: Get the authenticated account's statistics
      description: |
        Returns a dashboard of aggregate figures. What the response covers is
        derived entirely from the caller's role — it cannot be requested or
        overridden:

        * A **farmer** gets `scope: farm`: totals for their own fields, plots
          and rentals only.
        * An **admin** gets `scope: platform`: the same figures across every
          farmer, plus an `accounts` group that a farmer never sees.

        `occupancyRate` is a ratio in `[0, 1]`, not a percentage. Areas are
        reported in square meters. `last30Days` / `registeredLast30Days`
        count rows created in the 30 days up to `generatedAt`.

        Customers and any other role receive 403.
      operationId: getStatistics
      responses:
        '200':
          description: The statistics the account is entitled to see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
              examples:
                farm:
                  summary: A farmer's own holdings
                  value:
                    scope: farm
                    generatedAt: '2026-09-13T16:21:04Z'
                    fields: { total: 3, areaSquareMeters: 128394.5 }
                    plots: { total: 42, rented: 17, available: 25, areaSquareMeters: 91002.1, occupancyRate: 0.4047619 }
                    rentals: { total: 58, active: 17, last30Days: 6 }
                platform:
                  summary: Platform-wide totals for an admin
                  value:
                    scope: platform
                    generatedAt: '2026-09-13T16:21:04Z'
                    fields: { total: 120, areaSquareMeters: 4128394.5 }
                    plots: { total: 640, rented: 301, available: 339, areaSquareMeters: 2091002.1, occupancyRate: 0.4703125 }
                    rentals: { total: 812, active: 301, last30Days: 44 }
                    accounts: { total: 205, farmers: 40, customers: 164, registeredLast30Days: 12 }
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not authenticated
        '403':
          description: The authenticated account is neither a farmer nor an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient permissions
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error

components:
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: How many rows to return. Out of range is a 400, not a silent clamp.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    PageOffset:
      name: offset
      in: query
      required: false
      description: How many rows to skip. An offset past the end returns an empty page.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

  responses:
    BadPagination:
      description: A malformed pagination parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: limit must be a number between 1 and 100
    Unauthenticated:
      description: No valid session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not authenticated
    NotAnAdmin:
      description: The authenticated account is not an admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient permissions
    InternalError:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal error

  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT cookie set by `POST /api/auth/login`. Valid for 15 minutes.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Surrounding whitespace is trimmed before lookup.
          example: user@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple

    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, role, postal_code]
      description: |
        Fields are role-dependent. A `farmer` must also supply `farm_name` and
        `address`; a `customer` supplies only the shared fields plus
        `postal_code`. `role` must be `farmer` or `customer` — `admin` is
        rejected.
      properties:
        first_name:
          type: string
          example: Ada
        last_name:
          type: string
          example: Lovelace
        email:
          type: string
          format: email
          description: Surrounding whitespace is trimmed; must be unique.
          example: ada@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple
        role:
          type: string
          enum: [farmer, customer]
          example: customer
        postal_code:
          type: integer
          format: int32
          description: The account's postal code; required for both roles.
          example: 76133
        farm_name:
          type: string
          description: Required when `role` is `farmer`; ignored otherwise.
          example: Green Acres
        address:
          type: string
          description: Required when `role` is `farmer`; ignored otherwise.
          example: 1 Farm Lane, 76133 Karlsruhe
        description:
          type: string
          description: Optional free-text description of the farm; only used when `role` is `farmer`.
          example: A small family farm since 1998.

    SessionAccount:
      type: object
      description: |
        The identity returned after authenticating. `postal_code` is 0 for an
        admin (no farmer/customer subtype row carries one) -- treat 0 as
        "unknown", not literally postal code zero.
      required: [id, role, first_name, last_name, postal_code]
      properties:
        id:
          type: string
          format: uuid
          example: 6f1a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8
        role:
          $ref: '#/components/schemas/Role'
        first_name:
          type: string
          example: Ada
        last_name:
          type: string
          example: Lovelace
        postal_code:
          type: integer
          format: int32
          example: 76133

    Role:
      type: string
      description: Implied by which subtype table the account joins to.
      enum: [admin, farmer, customer]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    GeoJSONPolygon:
      type: object
      description: A GeoJSON Polygon geometry.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          description: An array of linear rings; the first is the exterior boundary.
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
      example:
        type: Polygon
        coordinates:
          - - [9.1798, 48.7758]
            - [9.1808, 48.7758]
            - [9.1808, 48.7768]
            - [9.1798, 48.7768]
            - [9.1798, 48.7758]

    CreateFieldRequest:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed.
          example: North Field
        coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJSONPolygon'
          description: Any simple polygon — there is no rectangle requirement.

    CreatePlotRequest:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed.
          example: Plot A
        coordinates:
          allOf:
            - $ref: '#/components/schemas/GeoJSONPolygon'
          description: Any simple polygon that lies within the field's boundaries.

    Farm:
      type: object
      required: [id, farmerId, name, address, description, foundedAt, totalSquareMeters]
      properties:
        id:
          type: string
          format: uuid
          description: ID of the farm; also the id used by `GET /api/farms/{farmID}` and the `farm` field on `Field`/`NearbyPlot`.
        farmerId:
          type: string
          format: uuid
          description: ID of the account that runs this farm.
        name:
          type: string
          example: Green Acres
        address:
          type: string
          example: 1 Farm Lane, 76133 Karlsruhe
        description:
          type: string
          example: A small family farm since 1998.
        foundedAt:
          type: string
          format: date
          nullable: true
          description: The date the farm was founded, or null if not set.
          example: '1998-04-12'
        totalSquareMeters:
          type: number
          format: double
          description: |
            Sum of the area of every plot across every field owned by this
            farmer, computed live. Zero for a farmer with no fields or plots.
          example: 12500.75

    Field:
      type: object
      required: [id, name, farm, coordinates]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: North Field
        farm:
          type: string
          format: uuid
          description: ID of the farm this field belongs to.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'

    Plot:
      type: object
      required: [id, name, field, coordinates, areaSquareMeters]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plot A
        field:
          type: string
          format: uuid
          description: ID of the field this plot belongs to.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'
        areaSquareMeters:
          type: number
          format: double
          description: The plot's area in square meters, computed geodesically from its boundary.
          example: 2340.5

    NearbyPlot:
      type: object
      required: [id, name, field, farm, coordinates, areaSquareMeters, distanceMeters, crops]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plot A
        field:
          type: string
          format: uuid
          description: ID of the field this plot belongs to.
        farm:
          type: string
          format: uuid
          description: ID of the farm this plot belongs to; also the id used by `GET /api/farms/{farmID}`.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'
        areaSquareMeters:
          type: number
          format: double
          description: The plot's area in square meters, computed geodesically from its boundary.
          example: 2340.5
        distanceMeters:
          type: number
          format: double
          description: Distance from the search point to the plot's centroid, in meters.
          example: 1523.42
        crops:
          type: array
          description: The crops this plot currently offers, orderable via `POST /api/rentals`.
          items:
            $ref: '#/components/schemas/Crop'

    PlotWithCrops:
      type: object
      required: [id, name, field, coordinates, areaSquareMeters, crops]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plot A
        field:
          type: string
          format: uuid
          description: ID of the field this plot belongs to.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'
        areaSquareMeters:
          type: number
          format: double
          description: The plot's area in square meters, computed geodesically from its boundary.
          example: 2340.5
        crops:
          type: array
          description: The crops this plot currently offers.
          items:
            $ref: '#/components/schemas/Crop'

    FieldWithPlots:
      type: object
      required: [id, name, farm, coordinates, plots]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: North Field
        farm:
          type: string
          format: uuid
          description: ID of the farm this field belongs to.
        coordinates:
          $ref: '#/components/schemas/GeoJSONPolygon'
        plots:
          type: array
          items:
            $ref: '#/components/schemas/PlotWithCrops'

    Crop:
      type: object
      description: A crop in the catalog, with the fixed duration renting it books for.
      required: [id, name, durationMonths]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Tomatoes
        durationMonths:
          type: integer
          format: int32
          description: How long renting this crop books a plot for.
          example: 4

    CreateCropRequest:
      type: object
      required: [name, durationMonths]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed; must be unique in the catalog.
          example: Tomatoes
        durationMonths:
          type: integer
          format: int32
          minimum: 1
          example: 4

    SetPlotCropsRequest:
      type: object
      required: [cropIds]
      properties:
        cropIds:
          type: array
          description: The full set of crop ids the plot should offer, replacing any previous set.
          items:
            type: string
            format: uuid

    RentPlotRequest:
      type: object
      required: [plotId, cropId]
      properties:
        plotId:
          type: string
          format: uuid
          description: ID of the plot to rent.
          example: ed453eb5-2abb-4fcb-9421-f9b69490fe37
        cropId:
          type: string
          format: uuid
          description: ID of the crop to plant. Must be offered by the plot's field.
          example: 3fa1d9c4-6b2e-4e2a-9a3e-3f2b1c0d4e5f

    Rental:
      type: object
      required: [id, plotId, cropId, startAt, endAt]
      properties:
        id:
          type: string
          format: uuid
        plotId:
          type: string
          format: uuid
          description: ID of the rented plot.
        cropId:
          type: string
          format: uuid
          description: ID of the crop being planted.
        startAt:
          type: string
          format: date-time
          description: |
            When the rental begins, set from the database clock at booking
            time.
          example: '2026-09-13T14:49:56+02:00'
        endAt:
          type: string
          format: date-time
          description: |
            When the rental ends, exclusive — the crop's duration after
            `startAt`. A rental beginning exactly at another's `endAt` does
            not conflict.
          example: '2027-01-13T14:49:56+01:00'

    RentalWithPlot:
      allOf:
        - $ref: '#/components/schemas/Rental'
        - type: object
          required: [plot, crop]
          properties:
            plot:
              $ref: '#/components/schemas/Plot'
            crop:
              $ref: '#/components/schemas/Crop'

    Customer:
      type: object
      required: [id, email, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string

    RentalWithPlotAndCustomer:
      allOf:
        - $ref: '#/components/schemas/Rental'
        - type: object
          required: [plot, fieldName, customer]
          properties:
            plot:
              $ref: '#/components/schemas/Plot'
            fieldName:
              type: string
              description: Name of the field the rented plot belongs to.
              example: North Field
            customer:
              $ref: '#/components/schemas/Customer'

    PageMeta:
      type: object
      description: >-
        The window a listing returned, and how many rows matched the filter in
        total. `total` counts every match, not just the rows on this page, and
        is taken in the same query as the rows — so the two cannot disagree.
        A page past the end returns no rows and a `total` of `0`.
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          format: int64
          example: 137
        limit:
          type: integer
          format: int32
          example: 20
        offset:
          type: integer
          format: int32
          example: 0

    FarmOwner:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          example: Old
        lastName:
          type: string
          example: MacDonald
        email:
          type: string
          format: email
          example: old@example.com

    FarmListing:
      type: object
      required: [id, farmerId, name, address, postalCode, owner, createdAt, fields, plots, activeRentals]
      properties:
        id:
          type: string
          format: uuid
          description: The farm, as accepted by `GET /api/farms/{farmID}`.
        farmerId:
          type: string
          format: uuid
          description: The farmer account that owns this farm.
        name:
          type: string
          example: Green Acres
        address:
          type: string
          example: 1 Farm Lane
        postalCode:
          type: integer
          format: int32
          description: The owner's postal code, which lives on the farmer rather than the farm.
          example: 76133
        owner:
          $ref: '#/components/schemas/FarmOwner'
        createdAt:
          type: string
          format: date-time
          description: When the owning account was registered.
        fields:
          $ref: '#/components/schemas/FieldStatistics'
        plots:
          $ref: '#/components/schemas/PlotStatistics'
        activeRentals:
          type: integer
          format: int64
          description: Rentals on this farm's plots covering the present moment.
          example: 17

    FarmPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FarmListing'

    AccountListing:
      type: object
      required: [id, firstName, lastName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Old
        lastName:
          type: string
          example: MacDonald
        email:
          type: string
          format: email
          example: old@example.com
        role:
          oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
          description: >-
            Derived from subtype membership. `null` for an account belonging to
            no subtype table at all.
        createdAt:
          type: string
          format: date-time

    AccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AccountListing'

    StatisticsScope:
      type: string
      description: >-
        What a Statistics payload covers. Derived from the caller's role; it
        cannot be requested.
      enum: [farm, platform]

    FieldStatistics:
      type: object
      required: [total, areaSquareMeters]
      properties:
        total:
          type: integer
          format: int64
          example: 3
        areaSquareMeters:
          type: number
          format: double
          example: 128394.5

    PlotStatistics:
      type: object
      required: [total, rented, available, areaSquareMeters, occupancyRate]
      properties:
        total:
          type: integer
          format: int64
          example: 42
        rented:
          type: integer
          format: int64
          description: Plots with a rental covering the present moment.
          example: 17
        available:
          type: integer
          format: int64
          example: 25
        areaSquareMeters:
          type: number
          format: double
          example: 91002.1
        occupancyRate:
          type: number
          format: double
          description: '`rented / total` as a ratio in `[0, 1]`; `0` when `total` is `0`.'
          minimum: 0
          maximum: 1
          example: 0.4047619

    RentalStatistics:
      type: object
      required: [total, active, last30Days]
      properties:
        total:
          type: integer
          format: int64
          example: 58
        active:
          type: integer
          format: int64
          description: Rentals whose period covers the present moment.
          example: 17
        last30Days:
          type: integer
          format: int64
          description: Rentals created in the 30 days up to `generatedAt`.
          example: 6

    AccountStatistics:
      type: object
      description: Platform scope only.
      required: [total, farmers, customers, registeredLast30Days]
      properties:
        total:
          type: integer
          format: int64
          example: 205
        farmers:
          type: integer
          format: int64
          example: 40
        customers:
          type: integer
          format: int64
          example: 164
        registeredLast30Days:
          type: integer
          format: int64
          description: Accounts created in the 30 days up to `generatedAt`.
          example: 12

    Statistics:
      type: object
      required: [scope, generatedAt, fields, plots, rentals]
      properties:
        scope:
          $ref: '#/components/schemas/StatisticsScope'
        generatedAt:
          type: string
          format: date-time
          example: '2026-09-13T16:21:04Z'
        fields:
          $ref: '#/components/schemas/FieldStatistics'
        plots:
          $ref: '#/components/schemas/PlotStatistics'
        rentals:
          $ref: '#/components/schemas/RentalStatistics'
        accounts:
          allOf:
            - $ref: '#/components/schemas/AccountStatistics'
          description: Present only when `scope` is `platform`.

    CreateAnnouncementRequest:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          maxLength: 200
          description: |
            The announcement subject. Leading and trailing whitespace is
            trimmed. Measured in characters, not bytes, after trimming.
          example: Ernte am Samstag
        body:
          type: string
          maxLength: 10000
          description: |
            The message text. Line breaks are preserved in both the email and
            the board. Trimmed, must not be empty, and measured in characters,
            not bytes.
          example: |
            Am Samstag ab 9 Uhr wird geerntet. Bringt bitte eigene Kisten mit.
        field_id:
          type: string
          format: uuid
          description: |
            Narrows the audience to the customers currently renting a plot of
            this field. Must be owned by the authenticated farmer. At most one
            of `field_id`/`plot_id` may be set; omitting both reaches every
            current renter.
        plot_id:
          type: string
          format: uuid
          description: |
            Narrows the audience to the customer currently renting this one
            plot. Must belong to a field owned by the authenticated farmer. At
            most one of `field_id`/`plot_id` may be set.

    Announcement:
      type: object
      required: [id, farmer, farm_name, subject, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        farmer:
          type: string
          format: uuid
          description: The account id of the farmer who posted it.
        farm_name:
          type: string
          description: |
            The farm the notice came from. Always present, including on a
            farmer's own board — a customer rents from several farms, so the
            board is only readable if each notice says which one is writing.
          example: Hof Grünwald
        subject:
          type: string
          example: Ernte am Samstag
        body:
          type: string
        field_id:
          type: string
          format: uuid
          description: Present when the notice was scoped to one field.
        plot_id:
          type: string
          format: uuid
          description: Present when the notice was scoped to one plot.
        created_at:
          type: string
          format: date-time

    CreatedAnnouncement:
      allOf:
        - $ref: '#/components/schemas/Announcement'
        - type: object
          required: [recipients]
          properties:
            recipients:
              type: integer
              format: int64
              description: |
                How many current customers the announcement was queued for.
                Delivery happens after this response, so it is not a count of
                successful sends, and it is `0` if the mail could not be
                queued at all — the announcement is stored either way.
              example: 12

    BroadcastRequest:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          description: The email subject. Leading and trailing whitespace is trimmed.
          example: Wartungsarbeiten am Sonntag
        body:
          type: string
          description: |
            The message text. Line breaks are preserved in the email. Trimmed,
            and must not be empty.
          example: |
            Am Sonntag von 8 bis 12 Uhr ist die Plattform nicht erreichbar.

    BroadcastAccepted:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: integer
          format: int64
          description: |
            How many farmers and customers the message was queued for. Delivery
            happens after this response, so it is not a count of successful
            sends.
          example: 204

    InboxItem:
      type: object
      required: [kind, id, subject, body, created_at]
      properties:
        kind:
          type: string
          enum: [broadcast, announcement, ripeness_notice]
          description: Which stored record this item came from.
        id:
          type: string
          format: uuid
        subject:
          type: string
          example: Ernte am Samstag
        body:
          type: string
        farm_name:
          type: string
          description: |
            The farm the notice came from. Present on `announcement` and
            `ripeness_notice` items; a `broadcast` has no farm to attribute
            and omits this field.
          example: Hof Grünwald
        field_name:
          type: string
          description: The field the notice is about. Present only on `ripeness_notice` items.
          example: Feld Nord
        crop_name:
          type: string
          description: The crop that is ready. Present only on `ripeness_notice` items.
          example: Zucchini
        created_at:
          type: string
          format: date-time

    CreateRipenessNoticeRequest:
      type: object
      required: [crop_id]
      properties:
        crop_id:
          type: string
          format: uuid
          description: The crop that is ready to harvest.

    RipenessNotice:
      type: object
      required: [id, farmer, farm_name, field, field_name, crop, crop_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        farmer:
          type: string
          format: uuid
          description: The account id of the farmer who posted it.
        farm_name:
          type: string
          example: Hof Grünwald
        field:
          type: string
          format: uuid
        field_name:
          type: string
          example: Feld Nord
        crop:
          type: string
          format: uuid
        crop_name:
          type: string
          example: Zucchini
        created_at:
          type: string
          format: date-time

    CreatedRipenessNotice:
      allOf:
        - $ref: '#/components/schemas/RipenessNotice'
        - type: object
          required: [recipients]
          properties:
            recipients:
              type: integer
              format: int64
              description: |
                How many customers currently growing this crop on this field
                the notice was queued for. Delivery happens after this
                response, so it is not a count of successful sends, and it is
                `0` if the mail could not be queued at all — the notice is
                stored either way.
              example: 3

security:
  - accessTokenCookie: []
