<!doctype html>
<html lang="de">
  <body style="margin:0;padding:24px;background:#f5f4f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1c1b18;">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
      <p style="margin:0 0 16px;font-size:15px;">Hallo {{ .Recipient.DisplayName }},</p>

      <p style="margin:0 0 16px;font-size:13px;color:#6b6862;">Neue Mitteilung von {{ .Data.FarmName }}</p>

      <h1 style="margin:0 0 16px;font-size:20px;font-weight:600;">{{ .Data.Subject }}</h1>

      <div style="font-size:15px;line-height:1.6;white-space:pre-wrap;">{{ .Data.Body }}</div>

      <p style="margin:32px 0 0;padding-top:16px;border-top:1px solid #e6e4de;font-size:13px;color:#6b6862;">
        Sie erhalten diese Nachricht, weil Sie zurzeit eine Parzelle von {{ .Data.FarmName }} gepachtet haben.
      </p>
    </div>
  </body>
</html>
